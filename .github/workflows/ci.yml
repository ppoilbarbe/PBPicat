name: CI

on:
  push:
    branches: ["**"]
    # Semver tags only (glob syntax — + quantifier not supported by GitHub)
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

# Cancel in-flight runs for the same ref when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          activate-environment: true

      - name: Compile translations
        run: pybabel compile -d src/pbpicat/locale -D pbpicat

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test NOCONDA=1

  # ── Pre-commit hooks ─────────────────────────────────────────────────────────
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          activate-environment: true

      - name: Cache pre-commit hook environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks on all files
        run: make hooks NOCONDA=1

  # ── Documentation ───────────────────────────────────────────────────────────
  docs:
    name: Build docs
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          activate-environment: true

      - name: Build HTML documentation
        run: make docs NOCONDA=1

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html/
          if-no-files-found: error

  # ── Build executables ────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.os }}
    needs: [test, hooks]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          activate-environment: true

      - name: Compile translations
        run: pybabel compile -d src/pbpicat/locale -D pbpicat

      - name: Build with PyInstaller
        # Call PyInstaller directly to avoid GNU Make portability issues on Windows runners.
        # Explicit `shell: bash` is required here (not the Windows-runner default of
        # PowerShell): this step's multi-line `run: |` uses bash-style `\` line
        # continuations, which PowerShell parses as the unary `--` operator instead.
        shell: bash
        env:
          # Use the tag name (strip leading 'v') on tag runs; fall back to 'dev'.
          PBPICAT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          export PBPICAT_VERSION="${PBPICAT_VERSION#v}"
          pyinstaller --clean --noconfirm \
            --distpath dist --workpath build/pyinstaller \
            pbpicat.spec

      - name: Zip .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          for app in *.app; do
            zip -r "${app%.app}.zip" "$app"
            rm -rf "$app"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: dist/pbpicat-*
          if-no-files-found: error

  # ── GitHub release ───────────────────────────────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        id: notes
        run: |
          body=$(python tools/changelog_notes.py "${GITHUB_REF_NAME#v}")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          files: dist/pbpicat-*
          fail_on_unmatched_files: true
