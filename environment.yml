name: pbpicat

channels:
  - conda-forge

dependencies:
  - python=3.12
  # GUI
  - pyside6
  # Fonts (bundled in the PyInstaller binary via pbpicat.spec)
  - fonts-conda-ecosystem   # meta-package: Ubuntu, DejaVu, Inconsolata, SourceCodePro
  # Image support (Pillow fallback + HEIC/HEIF)
  - pillow
  - pillow-heif
  # Tests
  - pytest
  - pytest-qt
  - pytest-cov
  # Independent EXIF read/write for building & verifying test fixtures (not used by app code)
  - piexif
  # Lint / hooks
  - ruff
  - pre-commit
  # GitHub CLI
  - gh
  # Packaging
  - pyinstaller
  # i18n tools
  - babel
  # Documentation (Sphinx, readthedocs)
  - sphinx
  - sphinx-rtd-theme
  - sphinx-autobuild
  # Build tooling (make needed on Windows runners)
  - make
  # Dev install (editable — lancez ensuite : make install)
  - pip
  - pip:
      # EXIF/IPTC/XMP metadata reading (image viewer metadata panel) — not on conda-forge
      - pyexiv2>=2.14
