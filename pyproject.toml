[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbpicat"
version = "1.8.0"
description = "Picture catalog tool that organizes images by renaming them into a template-driven directory structure"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philippe Poilbarbe", email = "philippe@cardolan.net" }]
keywords = ["photos", "renaming", "sidecar", "gui", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-cov>=5",
]

[project.scripts]
pbpicat = "pbpicat.__main__:main"

[project.urls]
Repository = "https://github.com/ppoilbarbe/PBPicat"

[tool.hatch.build.targets.wheel]
packages = ["src/pbpicat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = ["--cov=pbpicat", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length    = 120
target-version = "py312"
src            = ["src"]
builtins       = ["_"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
extend-select = ["PGH", "BLE"]

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "lf"
