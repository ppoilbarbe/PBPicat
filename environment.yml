name: pbpicat

channels:
  - conda-forge

dependencies:
  - python=3.12
  # GUI
  - pyside6
  # Image support (Pillow fallback + HEIC/HEIF)
  - pillow
  - pillow-heif
  # EXIF manipulation (strip orientation tag after JPEG rotation)
  - piexif
  # Tests
  - pytest
  - pytest-qt
  - pytest-cov
  # Lint / hooks
  - ruff
  - pre-commit
  # GitHub CLI
  - gh
  # Packaging
  - pyinstaller
  # i18n tools
  - babel
  # Build tooling (make needed on Windows runners)
  - make
  # Dev install (editable — lancez ensuite : make install)
  - pip
