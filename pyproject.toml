[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbpicat"
version = "1.19.1"
description = "Picture catalog tool that organizes images by renaming them into a template-driven directory structure"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philippe Poilbarbe", email = "philippe@cardolan.net" }]
keywords = ["photos", "renaming", "sidecar", "gui", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "pyexiv2>=2.14",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-qt>=4",
    "pytest-cov>=5",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-autobuild>=2024",
    # Independent EXIF read/write for building & verifying test fixtures (not used by app code)
    "piexif>=1.1",
]

[project.scripts]
pbpicat = "pbpicat.__main__:main"

[project.urls]
Repository = "https://github.com/ppoilbarbe/PBPicat"

[tool.hatch.build.targets.wheel]
packages = ["src/pbpicat"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# pyexiv2 (PyPI) only ships macosx_14_0_arm64 wheels, hence the __osx=14.0 virtual
# package on osx-arm64 below (past pixi's default of 13.0).
platforms = [{ platform = "osx-arm64", "__osx" = "14.0" }, "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# GUI
pyside6 = "*"
# Fonts (bundled in the PyInstaller binary via pbpicat.spec)
fonts-conda-ecosystem = "*"   # meta-package: Ubuntu, DejaVu, Inconsolata, SourceCodePro
# Image support (Pillow fallback + HEIC/HEIF)
pillow = "*"
pillow-heif = "*"
# Tests
pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
# Independent EXIF read/write for building & verifying test fixtures (not used by app code)
piexif = "*"
# Lint / hooks
ruff = "*"
pre-commit = "*"
# GitHub CLI
gh = "*"
# Packaging
pyinstaller = "*"
# i18n tools
babel = "*"
# Documentation (Sphinx, readthedocs)
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autobuild = "*"
# Build tooling (make needed on Windows runners)
make = "*"

[tool.pixi.pypi-dependencies]
# EXIF/IPTC/XMP metadata reading (image viewer metadata panel) — not on conda-forge
pyexiv2 = ">=2.14"
# Dev install (editable) — pulls in [project.dependencies] and the "dev" extra
pbpicat = { path = ".", editable = true, extras = ["dev"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = ["--cov=pbpicat", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length    = 120
target-version = "py312"
src            = ["src"]
builtins       = ["_"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
extend-select = ["PGH", "BLE"]

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
skip-magic-trailing-comma = false
line-ending               = "lf"
