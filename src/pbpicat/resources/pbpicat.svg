<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background: deep navy fading to dark indigo -->
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>

    <!-- Subtle radial glow behind iris -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Center pupil gradient -->
    <radialGradient id="pupil" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#e0f2fe"/>
      <stop offset="45%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Blade geometry:
         Each blade is a 22×54 rounded rect, centre at (64, 81) = 17 px below icon centre (64, 64).
         Top edge at y = 81-27 = 54  → inner radius ≈ 10–15 px from icon centre.
         Bottom edge at y = 81+27 = 108 → outer radius ≈ 44 px from icon centre.
         Rotated 60° steps around (64, 64).
    -->
  </defs>

  <!-- ── Background ───────────────────────────────────────────────── -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Inner halo glow -->
  <circle cx="64" cy="64" r="56" fill="url(#halo)"/>

  <!-- ── Six iris blades (rainbow, each 88 % opaque) ───────────────── -->
  <!-- Rose -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#f43f5e" opacity="0.88" transform="rotate(0,64,64)"/>
  <!-- Orange -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#fb923c" opacity="0.88" transform="rotate(60,64,64)"/>
  <!-- Amber -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#fbbf24" opacity="0.88" transform="rotate(120,64,64)"/>
  <!-- Emerald -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#34d399" opacity="0.88" transform="rotate(180,64,64)"/>
  <!-- Sky -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#38bdf8" opacity="0.88" transform="rotate(240,64,64)"/>
  <!-- Violet -->
  <rect x="53" y="54" width="22" height="54" rx="7"
        fill="#a78bfa" opacity="0.88" transform="rotate(300,64,64)"/>

  <!-- ── Outer aperture housing ring ───────────────────────────────── -->
  <circle cx="64" cy="64" r="46"
          fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.14"/>

  <!-- ── Centre hole + lens ────────────────────────────────────────── -->
  <!-- Dark centre disc (hides messy blade-overlap interior) -->
  <circle cx="64" cy="64" r="17" fill="#0a0f1e"/>

  <!-- Thin iris ring -->
  <circle cx="64" cy="64" r="14.5"
          fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.80"/>

  <!-- Lens glass / pupil -->
  <circle cx="64" cy="64" r="11" fill="url(#pupil)"/>

  <!-- Dark pupil centre -->
  <circle cx="64" cy="64" r="4.5" fill="#0a0f1e"/>

  <!-- White specular catch-light -->
  <circle cx="64" cy="64" r="1.8" fill="#ffffff" opacity="0.95"/>

  <!-- Off-centre glint (lens reflection) -->
  <ellipse cx="70" cy="57" rx="4" ry="2.5"
           fill="#ffffff" opacity="0.38" transform="rotate(-22,70,57)"/>
</svg>
