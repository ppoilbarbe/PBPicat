name: CI

on:
  push:
    branches: ["**"]
    # Semver tags only (glob syntax — + quantifier not supported by GitHub)
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

# Cancel in-flight runs for the same ref when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pbpicat
          conda-remove-defaults: 'true'

      - name: Run test suite
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: make test NOCONDA=1

  # ── Pre-commit hooks ─────────────────────────────────────────────────────────
  hooks:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pbpicat
          conda-remove-defaults: 'true'

      - name: Cache pre-commit hook environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks on all files
        shell: bash -el {0}
        run: make hooks NOCONDA=1

  # ── Build executables ────────────────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.os }}
    needs: [test, hooks]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: pbpicat
          conda-remove-defaults: 'true'

      - name: Build with PyInstaller
        # .mo files are committed; call PyInstaller directly to avoid GNU Make
        # and gettext portability issues on Windows runners.
        shell: bash -el {0}
        run: |
          pyinstaller --clean --noconfirm \
            --distpath dist --workpath build/pyinstaller \
            pbpicat.spec

      - name: Zip .app bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          for app in *.app; do
            zip -r "${app%.app}.zip" "$app"
            rm -rf "$app"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}
          path: dist/PBPicat-*
          if-no-files-found: error

  # ── GitHub release ───────────────────────────────────────────────────────────
  release:
    name: Release ${{ github.ref_name }}
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/PBPicat-*
          fail_on_unmatched_files: true
