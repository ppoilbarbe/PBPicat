name: pbpicat

channels:
  - conda-forge

dependencies:
  - python=3.12
  # GUI
  - pyside6
  # Image support (Pillow fallback + HEIC/HEIF)
  - pillow
  - pillow-heif
  # Tests
  - pytest
  - pytest-qt
  - pytest-cov
  # Lint / hooks
  - ruff
  - pre-commit
  # GitHub CLI
  - gh
  # Packaging
  - pyinstaller
  # i18n tools
  - gettext
  # Dev install (editable — lancez ensuite : make install)
  - pip
